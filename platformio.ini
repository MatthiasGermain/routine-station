; PlatformIO project configuration
; Reference: https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
; Platform version is pinned so the build stays reproducible
; (see docs/decisions/0001-platformio-arduino.md).
platform = espressif32@6.12.0
board = esp32doit-devkit-v1
framework = arduino

; Libraries, pinned for the same reason.
; PubSubClient: MQTT client (see docs/decisions/0006-pubsubclient.md).
; ArduinoJson: reads the commands and writes the messages of docs/protocol.md.
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.3

; Must match SERIAL_BAUD in src/main.cpp
monitor_speed = 115200
